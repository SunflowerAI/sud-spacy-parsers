[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "la"
pipeline = ["tok2vec", "parser", "morphologizer", "lemmatizer", "tagger"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = -1
max_steps = 20000
eval_frequency = 200
frozen_components = ["tok2vec", "parser", "morphologizer", "lemmatizer"]
annotating_components = ["tok2vec", "morphologizer"]
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.GoldTokCorpus.v1"
path = ${paths.train}
max_length = 0
limit = 0
shuffle = true

[corpora.dev]
@readers = "sud.GoldTokCorpus.v1"
path = ${paths.dev}
max_length = 0
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 1.0
pos_acc = 0.0
tag_micro_p = 0.0
tag_micro_r = 0.0
tag_micro_f = 0.0
dep_uas = 0.0
dep_las = 0.0
dep_las_per_type = null
sents_p = 0.0
sents_r = 0.0
sents_f = 0.0
morph_acc = 0.0
lemma_acc = 0.0

[initialize.tokenizer]

[initialize.components]

[initialize.after_init]
@callbacks = "sud.WarmStartTagger.v1"
source = "training_la_aug_xpos/model-best"

[components.tok2vec]
source = "training_la_aug_lemma/model-best"

[components.tagger]
factory = "tagger"
neg_prefix = "!"
overwrite = false

[components.parser]
source = "training_la_aug_lemma/model-best"

[components.morphologizer]
source = "training_la_aug_lemma/model-best"

[components.lemmatizer]
source = "training_la_aug_lemma/model-best"

[corpora.train.augmenter]
@augmenters = "sud.la_orth_variants.v1"
seed = 0
p_v = 0.5
p_j = 0.5
p_lig = 0.25
p_capital = 0.5
p_length = 0.5
p_uniform_length = 0.5
p_breve_doc = 0.3
max_breve_rate = 0.5

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[initialize.components.tagger]

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[initialize.components.tagger.labels]
@readers = "spacy.read_labels.v1"
path = "labels_config_la_xposwarm/tagger.json"
require = true

[components.tagger.model.tok2vec]
@architectures = "sud.Tok2VecPlusFeats.v1"

[components.tagger.model.tok2vec.tok2vec]
@architectures = "spacy.HashEmbedCNN.v2"
pretrained_vectors = null
width = 96
depth = 4
embed_size = 5000
window_size = 1
maxout_pieces = 3
subword_features = true

[components.tagger.model.tok2vec.feats_embed]
@architectures = "sud.MultiHashEmbedFeats.v1"
width = 32
attrs = ["POS"]
rows = [100]
feats = ["Number", "Case", "Gender", "InflClass", "Aspect", "PronType"]
feat_rows = [16, 64, 32, 64, 16, 64]
include_static_vectors = false