[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "la"
pipeline = ["morphologizer", "lemmatizer", "tok2vec", "tagger", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = -1
max_steps = 20000
eval_frequency = 200
frozen_components = ["morphologizer", "lemmatizer"]
annotating_components = ["morphologizer", "lemmatizer"]
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.GoldTokCorpus.v1"
path = ${paths.train}
max_length = 0
limit = 0
shuffle = true

[corpora.dev]
@readers = "sud.GoldTokCorpus.v1"
path = ${paths.dev}
max_length = 0
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 0.5
pos_acc = 0.0
tag_micro_p = null
tag_micro_r = null
tag_micro_f = null
dep_uas = 0.25
dep_las = 0.25
dep_las_per_type = null
sents_p = null
sents_r = null
sents_f = 0.05

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
factory = "tok2vec"

[components.tagger]
factory = "tagger"
label_smoothing = 0.05
overwrite = false
neg_prefix = "!"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[components.morphologizer]
source = "training_la_order_lemma/model-best"

[components.lemmatizer]
source = "training_la_order_lemma/model-best"

[corpora.train.augmenter]
@augmenters = "sud.la_variants.v1"
seed = 0
p_v = 0.5
p_j = 0.5
p_lig = 0.25
p_capital = 0.5
p_length = 0.5
p_uniform_length = 0.5
p_breve_doc = 0.3
max_breve_rate = 0.5
p_sentence = 0.5
p_hyperbaton = 0.08
p_rise = 0.4

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[initialize.components.tagger]

[initialize.components.parser]

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[initialize.components.tagger.labels]
@readers = "spacy.read_labels.v1"
path = "labels_la_order/tagger.json"
require = true

[initialize.components.parser.labels]
@readers = "spacy.read_labels.v1"
path = "labels_la_order/parser.json"
require = true

[components.tok2vec.model.embed]
@architectures = "sud.LemmaVecFeatsEmbed.v1"
width = ${components.tok2vec.model.encode.width}
include_static_vectors = false
vectors = "scripts/la_lemmavec_96.npz"
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE"]
rows = [5000, 1000, 2500, 2500]
feats = ["Case", "Number", "Gender", "VerbForm", "Mood", "Tense", "Voice", "Person", "PronType", "Degree", "InflClass", "Aspect"]
feat_rows = [64, 16, 32, 32, 16, 32, 16, 16, 64, 32, 64, 16]
constant = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3

[components.tagger.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"