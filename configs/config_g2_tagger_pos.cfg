[paths]
corpus = "corpus_generic_v2"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "xx"
pipeline = ["tok2vec", "morphologizer"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 4000
max_epochs = 0
max_steps = 12000
eval_frequency = 500
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[pretraining]

[components]

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.GenericTagCorpus.v1"
path = ${paths.corpus}
split = "train"
seed = 0
give_pos = true

[corpora.dev]
@readers = "sud.GenericTagCorpus.v1"
path = ${paths.corpus}
split = "dev"
seed = 0
give_pos = true

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
pos_acc = 0.3
morph_acc = 0.7
morph_per_feat = null
tag_acc = null

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
factory = "tok2vec"

[components.morphologizer]
factory = "morphologizer"
# ⚠ TRUE HERE ON PURPOSE, AND FALSE IN THE PACKAGED ARM -- do not "align" them.
# Training needs the write: dev scoring reads the predictions back off the doc, and with
# overwrite = false a doc that already carries gold FEATS would score the INPUT and model-best
# would be chosen on a metric that is trivially perfect. Deployment needs the opposite: the
# morphologiser writes a joint POS=X|Feat=Val label, so overwrite = true also replaces the UPOS
# the user supplied -- its only input. `prepare_generic_bundle.py` flips this to false at package
# time and `package_generic_v2.sh` refuses to ship a bundle where it has not.
overwrite = true
extend = false
label_smoothing = 0.05

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.morphologizer.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.morphologizer.scorer]
@scorers = "spacy.morphologizer_scorer.v1"

[components.tok2vec.model.embed]
@architectures = "sud.GenericTagEmbed.v1"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "POS"]
rows = [8000, 3000, 3000, 3000, 64]
lang_embed = true
lang_embed_rows = 112
lang_embed_dim = 0

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 128
depth = 4
window_size = 1
maxout_pieces = 3

[components.morphologizer.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

