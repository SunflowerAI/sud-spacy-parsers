[paths]
train = "corpus_sa_multitask/train.spacy"
dev = "corpus_sa_multitask/dev.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "sa"
pipeline = ["tok2vec", "parser", "morphologizer", "lemmatizer", "tagger"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = ["tok2vec", "parser", "morphologizer", "lemmatizer"]
annotating_components = ["tok2vec", "morphologizer"]
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null

[components]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v2"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.CompoundCorpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[corpora.dev]
@readers = "sud.CompoundCorpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 1.0
dep_uas = 0.0
dep_las = 0.0
pos_acc = 0.0
morph_acc = 0.0
lemma_acc = 0.0

[initialize.tokenizer]

[initialize.components]

[initialize.after_init]
@callbacks = "sud.WarmStartTagger.v1"
source = "training_sa_multitask/model-best"

[components.tok2vec]
source = "training_sa_multitask/model-best"

[components.tagger]
factory = "tagger"
neg_prefix = "!"
overwrite = false

[components.parser]
source = "training_sa_multitask/model-best"

[components.morphologizer]
source = "training_sa_multitask/model-best"

[components.lemmatizer]
source = "training_sa_multitask/model-best"

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[initialize.components.tagger]

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[initialize.components.tagger.labels]
@readers = "spacy.read_labels.v1"
path = "labels_config_sa_xposwarm/tagger.json"
require = true

[components.tagger.model.tok2vec]
@architectures = "sud.Tok2VecPlusFeats.v1"

[components.tagger.model.tok2vec.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = 96
upstream = "tok2vec"

[components.tagger.model.tok2vec.feats_embed]
@architectures = "sud.MultiHashEmbedFeats.v1"
width = 32
attrs = ["POS", "MORPH"]
rows = [100, 4000]
feats = []
feat_rows = []
include_static_vectors = false