# The morph-first Sanskrit arm trained on the CLAUSE-MERGED corpus, with punctuation.
#
# WHAT CHANGES against `config_sa_morphparse2.cfg` — only the corpus and the reader:
#
#  - `corpus_sa_pmerged_norm` is `merge_sa_reparse.py`'s output: the treebank's clause units regrouped
#    into their source sentence, each non-initial unit's root re-attached by RE-PARSING the merged
#    string (parataxis / conj:coord / comp:obj / subj / mod …) so the result is single-rooted 92.1 %
#    of the time instead of carrying one root per clause. Marks are realised as `|` / `‖` PUNCT
#    tokens with `punct` arcs — the first sa arm to see punctuation at all.
#  - `sud.GoldTokNormCorpus.v1` replaces `sud.NormCorpus.v1` + `gold_preproc = true`: whole
#    multi-sentence documents (11 sentences each) with GOLD tokenisation for the predicted doc, so
#    the parser learns where a sentence STARTS. Under `gold_preproc` every example is already one
#    sentence, which is how the released arms came to read SENTS_F 100.00 while never having learned
#    to start one (standing hazard 4).
#
# ⚠ The mark FORMS are `|` and `‖` (U+2016), not `।`/`॥`: the sa tokeniser transliterates to CSL and
# folds every double daṇḍa to U+2016, so those two strings are what the parser can ever be shown.
#
# ⚠ Evaluate WITHOUT `--gold-preproc`, against the pmerged test file — the point of this arm is the
# sentence boundaries, and gold_preproc hands them to it for free.
#
[paths]
train = "corpus_sa_pmerged_norm/sa_vedic-sud-train.pmerged.csl_mwt.spacy"
dev = "corpus_sa_pmerged_norm/sa_vedic-sud-dev.pmerged.csl_mwt.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "sa"
pipeline = ["tok2vec", "tagger", "morphologizer", "lemmatizer", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = ["tok2vec", "tagger", "morphologizer", "lemmatizer"]
annotating_components = ["tok2vec", "morphologizer"]
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v2"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.GoldTokNormCorpus.v1"
path = ${paths.train}
max_length = 0
limit = 0
augmenter = null
shuffle = true

[corpora.dev]
@readers = "sud.GoldTokNormCorpus.v1"
path = ${paths.dev}
max_length = 0
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
dep_uas = 0.5
dep_las = 0.5

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
source = "training_sa_mt2_analyser_s1/model-best"

[components.tagger]
source = "training_sa_mt2_analyser_s1/model-best"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[components.morphologizer]
source = "training_sa_mt2_analyser_s1/model-best"

[components.lemmatizer]
source = "training_sa_mt2_analyser_s1/model-best"

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.parser.model.tok2vec.embed]
@architectures = "sud.AnalyserFeatsEmbed.v1"
width = 96
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "MORPH"]
rows = [2000, 1000, 1000, 1000, 1024]
include_static_vectors = false
table = null
runtime = true
feats = ["Case", "Number", "Gender", "Person"]
agreement = false
constant = false

[components.parser.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 3
window_size = 1
maxout_pieces = 3