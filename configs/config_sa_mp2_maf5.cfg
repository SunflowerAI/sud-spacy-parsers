# LEVER A: min_action_freq 30 -> 5.
# Pseudo-projective composite labels are individually rare, so the default threshold
# keeps only 38 of them (6 195 arcs) and discards 210 more covering ~960 arcs. At 5 it
# keeps 107 (6 900 arcs). This widens what the parser CAN express; it does not by
# itself address the reluctance to use it (predicted non-projective rate 2.1 % against
# a gold 8.3 %, precision 0.466 / recall 0.119).
# THE PARSER GENUINELY ON TOP OF THE MORPHOLOGISER — via the project's FREEZE RECIPE.
#
# Everything except the parser is SOURCED from the shipped joint arm and frozen; only the parser is
# trained, and it gets its OWN encoder reading the FEATS the frozen morphologizer wrote. Sharing a
# retrained encoder (the first draft of this config) would defeat the point: the morphologizer is a
# Tok2VecListener, so a retrained upstream changes its input while its own weights stay frozen.
#
# WHY A SECOND ENCODER IS THE ONLY WAY. In the joint arm all four heads listen to ONE encoder that
# is computed before any of them runs, so no head can see another's predictions and the pipeline
# order among them is cosmetic. Conditioning the parser on predicted morphology therefore needs a
# second pass over the tokens — which is what a dedicated encoder + `annotating_components` gives.
#
# ⚠ `annotating_components` LISTS tok2vec as well as morphologizer. The morphologizer is a listener
# on the frozen shared encoder; without tok2vec in that list the encoder never runs during training
# and the morphologizer annotates nothing (CLAUDE.md, docs/sud-misc-layer.md).
#
# ⚠ Compound survives the morphologizer's overwrite: it is 37 of its 1520 labels AND an input to
# its encoder, so it is re-predicted at P/R 1.000. Checked, not assumed — losing it would cost the
# +1.30 LAS the tokeniser-supplied feat is worth.
#
# THE PRIZE AND THE PRICE. Gold FEATS in the parser's embed is worth +6.21 to +7.59 LAS on this
# corpus; the honest lower bound with PREDICTED FEATS is +1.50 (measured by feeding a gold-trained
# arm predicted features, hence a LOWER bound — training through annotating_components is exactly
# what removes that pessimism). The price is a second encoder: docs/sanskrit.md put three encoders
# vs one at 25.85 MB vs 19.16 MB. Here only ONE extra encoder is added, for the parser alone.
#
# Agreement bits are OFF: measured as a per-token input at -0.79 Vedic / -3.53 UFAL LAS. The signal
# is relational and a per-token embed cannot express it.
# ⚠ `paths.train`/`paths.dev` name the LEAK-FREE, NORM-CARRYING corpus. They used to name
# `corpus_sa_multitask/`, which every run overrode on the command line — so the config on
# disk described an arm nobody had trained. That corpus predates the UFAL leak fix AND
# carries no NORM, which is this arm's whole lexical channel: the baseline reads dev LAS
# 57.14 here and 47.22 there, off the SAME weights. Hazard 2 — the default is the fix.

[paths]
train = "corpus_sa_mwt_rl2_norm/train.csl_mwt.spacy"
dev = "corpus_sa_mwt_rl2_norm/sa_vedic-sud-dev.relabeled_ext.csl_mwt.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "sa"
pipeline = ["tok2vec", "tagger", "morphologizer", "lemmatizer", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = ["tok2vec", "tagger", "morphologizer", "lemmatizer"]
annotating_components = ["tok2vec", "morphologizer"]
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v2"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.NormCorpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[corpora.dev]
@readers = "sud.NormCorpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
dep_uas = 0.5
dep_las = 0.5

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
source = "training_sa_mt2_analyser_s1/model-best"

[components.tagger]
source = "training_sa_mt2_analyser_s1/model-best"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 5

[components.morphologizer]
source = "training_sa_mt2_analyser_s1/model-best"

[components.lemmatizer]
source = "training_sa_mt2_analyser_s1/model-best"

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.parser.model.tok2vec.embed]
@architectures = "sud.AnalyserFeatsEmbed.v1"
width = 96
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "MORPH"]
rows = [2000, 1000, 1000, 1000, 1024]
include_static_vectors = false
table = null
runtime = true
feats = ["Case", "Number", "Gender", "Person"]
agreement = false
constant = false

[components.parser.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 3
window_size = 1
maxout_pieces = 3