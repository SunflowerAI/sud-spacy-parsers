# AGREEMENT AS A PARSER INPUT, on top of the shipped runtime-vidyut arm.
#
# A Sanskrit adjective/participle agrees with its noun in case, number and gender, and an arc that
# breaks that agreement is a wrong attachment 95.1 % of the time. Enforcing it at DECODE time was
# measured and does not pay (+0.05 LAS: on the 32 arcs it fired on it fixed 10 and broke 8) — a
# detector is not a fix, because forbidding an arc says nothing about where the token should go.
# So the agreement signal is handed to the parser as an INPUT to weigh instead of a veto to obey.
#
# WHY IT CAN ENTER AT ALL. All four heads are Tok2VecListeners on ONE shared encoder, which is
# computed before any of them runs — so no head can see another's predictions, and reordering the
# pipeline would not change that. Predicted FEATS are therefore unavailable to the parser by
# construction. vidyut's CANDIDATE SETS are not: they come from the tokeniser's `token.norm_` at
# tokenisation time, upstream of the encoder. Agreement is encoded as set COMPATIBILITY (do the two
# candidate sets intersect on Case, Number and Gender?), which also handles ambiguous forms
# correctly. Measured with no predicted morphology at all: gold ADJ--mod-->NOUN pairs are 89.5 %
# compatible against 65.4 % for random nearby ADJ/NOUN non-arcs.
#
# +9 dims on the multi-hot block (21 -> 30): compatible at each of six offsets, any-left,
# any-right, and "the analyser knows nothing about me" — the last so an unknown form is not
# encoded as incompatible with everything.
# THE ARM THE WHEEL ACTUALLY SHIPS: joint multi-task, one shared encoder for four
# objectives — with the runtime-vidyut candidate-set channel added, and the affix window
# (suffix 5 / 8 000 rows) KEPT, since dropping it would confound two changes.
#
# Everything measured so far (+1.09 LAS over control) was on the three-component split arm
# with a dedicated encoder. A shared listener serving tagger+parser+morphologizer+
# lemmatizer is a different animal, and this grid has already shown the two disagree:
# splitting vs joining moved Vedic LAS 0.5140 -> 0.5439 and UFAL the other way. So the
# gain is NOT assumed to transfer; this pair measures it.
#
# Reader is sud.NormCorpus.v1: under gold_preproc the predicted doc is built from gold
# words and would carry no NORM, so the channel would be absent in training and present
# at inference.
[paths]
train = "corpus_sa_multitask/train.spacy"
dev = "corpus_sa_multitask/dev.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "sa"
pipeline = ["tok2vec", "tagger", "parser", "morphologizer", "lemmatizer"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v2"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.NormCorpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[corpora.dev]
@readers = "sud.NormCorpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 0.15
dep_uas = 0.1
dep_las = 0.25
pos_acc = 0.1
morph_acc = 0.2
lemma_acc = 0.2

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
factory = "tok2vec"

[components.tagger]
factory = "tagger"
label_smoothing = 0.05
overwrite = false
neg_prefix = "!"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[components.morphologizer]
factory = "morphologizer"

[components.lemmatizer]
factory = "trainable_lemmatizer"
backoff = "orth"
min_tree_freq = 3
overwrite = false
top_k = 1

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.morphologizer.scorer]
@scorers = "spacy.morphologizer_scorer.v1"

[components.morphologizer.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.lemmatizer.scorer]
@scorers = "spacy.lemmatizer_scorer.v1"

[components.lemmatizer.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tok2vec.model.embed]
@architectures = "sud.AnalyserFeatsEmbed.v1"
width = 96
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "MORPH"]
rows = [2000, 1000, 1000, 1000, 64]
include_static_vectors = false
suffixes = [5]
suffix_rows = [8000]
prefixes = []
prefix_rows = []
table = null
runtime = true
feats = ["Case", "Number", "Gender", "Person"]
agreement = true
constant = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 3
window_size = 1
maxout_pieces = 3

[components.tagger.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = 96
upstream = "*"

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = 96
upstream = "*"

[components.morphologizer.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = 96
upstream = "*"

[components.lemmatizer.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = 96
upstream = "*"