# lzh base arm that LEARNS SENTENCE BOUNDARIES — the one job `clause_parser` still does for lzh.
#
# `config_lzh.cfg` with one change: `sud.GoldTokCorpus.v1` replaces `spacy.Corpus.v1` +
# `gold_preproc = true`, so the parser is trained on whole 10-sentence documents (which is how the
# corpora were already converted — `gold_preproc` was throwing that structure away) with GOLD
# tokenisation for the predicted doc, hence zero tokeniser skew.
#
# WHY. Measured on the released arm, not inferred. Fed three punctuated 論語 sentences
# (學而時習之，不亦說乎？…？…？) `training_lzh_trad_sud_xw` returns ONE sentence and ZERO self-headed
# roots — the whole 24-token string comes back as one connected tree. Its own log reads
# `sents_f 1.0000`, which is standing hazard 4 exactly: under `gold_preproc` every dev example is
# already one sentence, so a parser that never learned to START one scores a free 100.
#
# The MARKS are already handled and are not what this fixes: since punctuation was restored to Kyoto
# (`align_kanripo_punct.py`, 100 193 marks) the arm tags every one `PUNCT` with the right Kyoto 記号
# XPOS and attaches it as `punct` — which is why the wheel ships `clause_parser --keep-marks`. If
# this arm segments, `clause_parser` has no remaining job on lzh: stripping marks and normalising
# their morphology are both already redundant there.
#
# ⚠ THIS IS A BASE RETRAIN, NOT A LAYER. `seg` is a base recipe (CLAUDE.md; zh paid for this): every
# layer above — morph, lemma, the warm-started tagger, sud_subject, sud_shared — is sourced from the
# base and must be rebuilt on top of whatever this produces, and the MISC layer re-measured, since
# each of its pipes reads the base's own predictions.
#
# ⚠ Evaluate WITHOUT `--gold-preproc`. With it, SENTS_F is a free 100 and this change is invisible.
#
[paths]
train = "corpus_lzh_trad/lzh_kyoto-sud-train.relabeled_ext.udep_ruled.punct.rulemerged.spacy"
dev = "corpus_lzh_trad/lzh_kyoto-sud-dev.relabeled_ext.udep_ruled.punct.rulemerged.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "lzh"
pipeline = ["tok2vec", "tagger", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "lzh.CharTokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.GoldTokCorpus.v1"
path = ${paths.train}
max_length = 0
limit = 0
augmenter = null
shuffle = true

[corpora.dev]
@readers = "sud.GoldTokCorpus.v1"
path = ${paths.dev}
max_length = 0
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 0.5
pos_acc = 0.0
tag_micro_p = null
tag_micro_r = null
tag_micro_f = null
dep_uas = 0.25
dep_las = 0.25
dep_las_per_type = null
sents_p = null
sents_r = null
sents_f = 0.0

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
factory = "tok2vec"

[components.tagger]
factory = "tagger"
label_smoothing = 0.05
overwrite = false
neg_prefix = "!"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE"]
rows = [5000, 1000, 2500, 2500]
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3

[components.tagger.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"