[paths]
train = "corpus_lzh_trad/lzh_kyoto-sud-train.relabeled_ext.udep_ruled.punct.rulemerged.spacy"
dev = "corpus_lzh_trad/lzh_kyoto-sud-dev.relabeled_ext.udep_ruled.punct.rulemerged.spacy"
vectors = "vectors_lzh_siku96"
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "lzh"
pipeline = ["tok2vec", "parser", "morphologizer", "multifield_tagger"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = ["tok2vec", "parser", "morphologizer"]
annotating_components = ["tok2vec", "morphologizer"]
before_to_disk = null
before_update = null

[initialize]
after_init = null
vectors = "vectors_lzh_siku96"
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "lzh.CharTokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 1.0
pos_acc = 0.0
tag_micro_p = 0.0
tag_micro_r = 0.0
tag_micro_f = 0.0
dep_uas = 0.0
dep_las = 0.0
dep_las_per_type = null
sents_p = 0.0
sents_r = 0.0
sents_f = 0.0
morph_acc = 0.0

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
source = "training_lzh_seg_sud_xw"

[components.parser]
source = "training_lzh_seg_sud_xw"

[components.morphologizer]
source = "training_lzh_seg_sud_xw"

[components.multifield_tagger]
factory = "multifield_tagger"
sep = ","
n_fields = 4
tables = "models/lzh_xpos_tables.json"
project = true
upos_mask = true
overwrite = true
joint = true
field_weight = 0.0

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[initialize.components.tagger]

[components.multifield_tagger.model]
@architectures = "sud.MultiFieldTagger.v2"
field_sizes = [4, 12, 46, 84]
n_joint = 121

[initialize.components.tagger.labels]
@readers = "spacy.read_labels.v1"
path = "labels_config_lzh_xposwarm/tagger.json"
require = true

[components.multifield_tagger.model.tok2vec]
@architectures = "sud.Tok2VecPlusFeats.v1"

[components.multifield_tagger.model.tok2vec.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = 96
upstream = "tok2vec"

[components.multifield_tagger.model.tok2vec.feats_embed]
@architectures = "sud.Tok2VecPlusFeats.v1"

[components.multifield_tagger.model.tok2vec.feats_embed.tok2vec]
@architectures = "sud.MultiHashEmbedFeats.v1"
width = 32
attrs = ["POS"]
rows = [100]
feats = ["Case", "NameType", "Degree", "VerbForm", "PronType", "Person"]
feat_rows = [16, 32, 32, 16, 16, 16]
include_static_vectors = false

[components.multifield_tagger.model.tok2vec.feats_embed.feats_embed]
@architectures = "sud.StaticVecChannel.v1"
width = 96