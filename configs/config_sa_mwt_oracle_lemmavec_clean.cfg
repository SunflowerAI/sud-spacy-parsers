# CLEAN contrast against training_sa_mwt_oracle_lemma (gold lemma, HASH, 0.5661).
# Uses sud.LemmaOracleCorpus.v1, which copies gold LEMMA and NOT gold FEATS — the
# confound that made the first attempt score +6.52 when its own constant-vector control
# scored nearly as much. MORPH stays in attrs but now carries only tokeniser Compound.
# Gold lemma as a DISTRIBUTIONAL VECTOR, with no LEMMA hash column — the direct contrast against
# training_sa_mwt_oracle_lemma (same gold lemma, hash-embedded, 0.5661 / +2.22). If identity is
# all that matters this loses; if generalising across gam/yā/vraj matters, it wins.
# ORACLE ARM — NOT SHIPPABLE. Identical to config_sa_mwt.cfg except for the corpus reader and the
# tok2vec embed. It answers one question in one training run: what could a parser gain from a LEMMA
# channel and DECOMPOSED (per-feature) morphology channels, if both were perfect?
#
#   reader  sud.OracleCorpus.v1 copies the reference's gold LEMMA and gold FEATS onto the predicted
#           doc. That is leakage by design — nothing supplies either at inference.
#   embed   sud.MultiHashEmbedFeats.v1 with LEMMA alongside NORM (never instead of it: a wrong
#           lemma must not cost the model the form) and one small table per FEATURE, rather than
#           the single 64-row hash of the whole FEATS bundle the base arm uses for `Compound`.
#
# Both parser experiments that preceded this one (config_sa_morphfirst.cfg 2026-07-31,
# config_la_morphfirst.cfg 2026-08-04) used the BLOCK hash: `Case=Nom|Number=Sing` and
# `Case=Nom|Number=Plur` reached the parser as two unrelated symbols. sud.MultiHashEmbedFeats.v1
# postdates both (2026-08-12) and has only ever been attached to a tagger.
#
# `feats` deliberately EXCLUDES `Shared` (a SUD coordination annotation — part of what the parser is
# being asked to predict) and the long tail below ~300 tokens. It KEEPS `Compound`, which the base
# arm gets from the tokeniser at P/R 0.9998 and which is worth +1.30 LAS: dropping it silently would
# make the decomposition look like a regression. Value counts on corpus_sa_csl_mwt/train (163 802
# tokens): Number 3 vals / 72.6 % of tokens, Case 8 / 58.6, Gender 3 / 55.8, Tense 5 / 18.1,
# Person 3 / 14.1, Mood 6 / 14.0, VerbForm 5 / 6.2, Compound 1 / 5.5, Voice 6 / 0.7, ExtPos 6 / 0.5,
# PronType 6 / 0.2. Rows are sized from those value sets, so all eleven columns together cost 176
# rows against the block's 64 — the capacity confound that muddied la's morphfirst result runs the
# other way here.
#
# LEMMA gets NORM's 5000 rows: 12 024 lemma types / 44.2 % hapax against 38 883 form types / 61.6 %
# hapax, which is the whole reason to try this on Sanskrit.
[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "sa"
pipeline = ["tok2vec", "tagger", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v2"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.LemmaOracleCorpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[corpora.dev]
@readers = "sud.LemmaOracleCorpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 0.5
pos_acc = 0.0
tag_micro_p = null
tag_micro_r = null
tag_micro_f = null
dep_uas = 0.25
dep_las = 0.25
dep_las_per_type = null
sents_p = null
sents_r = null
sents_f = 0.0

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
factory = "tok2vec"

[components.tagger]
factory = "tagger"
label_smoothing = 0.05
overwrite = false
neg_prefix = "!"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.tok2vec.model.embed]
@architectures = "sud.LemmaVecEmbed.v1"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "MORPH"]
rows = [5000, 1000, 2500, 2500, 64]
vectors = "scripts/sa_lemmavec_96.npz"
constant = false
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3

[components.tagger.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"