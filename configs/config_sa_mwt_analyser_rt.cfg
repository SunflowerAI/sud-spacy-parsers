# RUNTIME vidyut, not a bundled extract. `vidyut` is declared as a dependency and the user fetches
# its data once (`vidyut.download_data`); nothing of vidyut's is redistributed inside the wheel.
#
# Why this beats the frozen table it replaces: a shipped extract has a key set, and on the Vedic
# test 6.5 %% of tokens fall outside it — while the analysers recognise 75.6 %% of exactly those
# forms. Enlarging the extract does not fix it (DCS's 108 888 extra forms moved honest coverage
# 86.7 %% -> 87.5 %%, because DCS is classical and the test is Vedic). Asking vidyut live has no key
# set at all, and makes training and inference run the SAME lookup, so there is no artefact to skew.
#
# The trade is Heritage, which cannot be a runtime dependency (sanskrit_parser pins werkzeug==2.1.2
# and drags in flask/pandas/sqlalchemy). Measured, on Case: pinned-and-right 0.493 -> 0.314, in-set
# recall 0.951 -> 0.945, confidently-WRONG 0.014 -> 0.010. Looser sets, no less safe — and whether
# that costs LAS is what training_sa_rl_analyser_rt measures against the frozen-table arm.
# MORPHOLOGICAL CANDIDATE SETS as a parser input, from vidyut ∩ Heritage.
#
# Baseline for this arm is config_sa_mwt_norm.cfg / training_sa_mwt_norm (LAS 0.5483), NOT the plain
# base arm: both read the same padapāṭha NORM, so the only variable is the analyser block.
#
# The case for it, from scripts/eval_sa_oracle_noise.py: gold FEATS is worth +5.76 LAS over the
# morphologiser's FEATS, and the gap is not that the morphologiser is unhelpful but that it is
# CONFIDENTLY WRONG on Case 14.6 % of the time, which inverts the attachment being decided. The
# intersected analysers are confidently wrong 1.5 % of the time, silent 2.5 %, and carry the gold
# value in the set 95.4 %. Same channel, an order of magnitude less of the error that costs.
#
# It needs NO pipeline reordering — the table is a tokeniser-time lookup, so the joint multi-task
# arm survives — and, unlike sud_lex_embed.py's, it needs no jackknifing, because it is built from
# outside the treebank and answers a form identically in training and at inference.
#
# ⚠ Deployable only once the TOKENISER writes token.norm_ (the same prerequisite config_sa_mwt_norm
# carries). Without it every token falls to the silent bit and this scores as its own control.

# NORM = the sandhi-reversed (padapāṭha) form, not the surface. Identical to config_sa_mwt.cfg
# except for the corpus reader — no architecture change at all, so the comparison is single-variable.
#
# The point of doing it this way round: `sud_unsandhi` lives inside the TOKENISER (sa_tokenizer.py
# stage 2), so its output is available BEFORE any component runs. Unlike a lemma channel, this needs
# no pipeline reordering, no frozen upstream components and no annotating_components — only a string
# swap in one column. PREFIX/SUFFIX/SHAPE are lexeme attributes read off the ORTH, so the sandhied
# surface stays visible; this swaps the identity channel rather than discarding the form.
#
# Corpus built by scripts/make_norm_corpus.py (predicted, not gold Unsandhied): NORM is rewritten on
# 30.0 % of training tokens, and the transducer scores 0.9685 on the Vedic test against 0.9855 on
# its own training split — so the training-side NORM is 1.7 points cleaner than the deployed one.
#
# ⚠ NOT DEPLOYABLE AS IS: the tokeniser publishes the padapāṭha on Token._.unsandhied, which no
# embed can read. Shipping this arm means having the tokeniser also write token.norm_.
[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "sa"
pipeline = ["tok2vec", "tagger", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v2"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.NormCorpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[corpora.dev]
@readers = "sud.NormCorpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 0.5
pos_acc = 0.0
tag_micro_p = null
tag_micro_r = null
tag_micro_f = null
dep_uas = 0.25
dep_las = 0.25
dep_las_per_type = null
sents_p = null
sents_r = null
sents_f = 0.0

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
factory = "tok2vec"

[components.tagger]
factory = "tagger"
label_smoothing = 0.05
overwrite = false
neg_prefix = "!"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.tok2vec.model.embed]
@architectures = "sud.AnalyserFeatsEmbed.v1"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "MORPH"]
rows = [5000, 1000, 2500, 2500, 64]
table = null
runtime = true
feats = ["Case", "Number", "Gender", "Person"]
constant = false
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3

[components.tagger.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"