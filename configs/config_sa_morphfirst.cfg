[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

# Morphology-informed parser (sa only). The released recipe runs [tok2vec, tagger, parser,
# morphologizer, ...], so the parser is committed BEFORE any morphology exists and never sees a
# single feature of it — in a case-based language, where the SUD label on a nominal is largely a
# function of its Case. It shows: UAS 0.693 vs LAS 0.560, i.e. ~13 points of the error is the
# parser attaching correctly and then mislabelling.
#
# Reordering alone does NOT fix this. `Tok2Vec.predict` runs at the position of the `tok2vec` PIPE
# (first) and caches into doc.tensor; a Tok2VecListener only reads that cache. So a listener-based
# parser can never see anything produced by a component that runs after tok2vec, wherever it sits.
# The parser therefore gets its OWN encoder (same 96/4 as the shared one), placed after the
# morphologizer, whose predicted FEATS it reads through MORPH.
#
# It trains on PREDICTED morph, never gold: `annotating_components` runs the frozen morphologizer
# over the predicted docs. Stamping gold FEATS on the predicted doc would leak and collapse at
# inference. (The morphologizer carries its own encoder, so it does not need tok2vec listed here.)
#
# Reuses the frozen tok2vec/tagger/morphologizer of the Compound arm (training_sa_morph3) — no base
# retrain; this replaces that arm's parser outright.
[nlp]
lang = "sa"
pipeline = ["morphologizer", "tok2vec", "tagger", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = ["morphologizer"]
annotating_components = ["morphologizer"]
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.CompoundCorpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[corpora.dev]
@readers = "sud.CompoundCorpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = true
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
tag_acc = 0.1
pos_acc = 0.0
morph_acc = 0.0
dep_uas = 0.0
dep_las = 0.9
dep_las_per_type = null
sents_p = 0.0
sents_r = 0.0
sents_f = 0.0

[initialize.tokenizer]

[initialize.components]

[components.morphologizer]
source = "training_sa_morph3/model-best"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

# The point of the whole arm: a DEDICATED encoder (not a listener), so the features are computed at
# the parser's own position in the pipeline — after the morphologizer has written its predictions.
[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

[components.tagger]
factory = "tagger"

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.tagger.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

# The shared encoder now runs AFTER the morphologizer, so MORPH here is its predicted FEATS — and
# because both the tagger and the parser listen to this one encoder, it keeps the multi-task
# co-training that the dedicated-encoder arm gave up (measured: that cost 1.7-2.0 LAS, more than the
# 1.0-1.9 the morphology was worth). POS is deliberately NOT fed: it would make the tagger's job a
# copy of its own input, collapsing the very gradient the parser is here to borrow.
[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "MORPH"]
rows = [5000, 1000, 2500, 2500, 1024]
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3
