# CONSTRAINED WORD-ORDER AUGMENTATION on the CLAUSE-MERGED, PUNCTUATED arm.
#
# `config_sa_mp2_pmerged.cfg` plus `sud.sa_order_variants.v1`: the two Sanskrit levers combined, one
# addressing what the parser is shown (whole sentences, with the daṇḍas the editor wrote) and the
# other how rigidly it may read order.
#
# ⚠ THE UNIT OF PERMUTATION IS THE CLAUSE. Under `gold_preproc` an example was one sentence and
# permuting the whole example was the same thing. Here `sud.GoldTokNormCorpus.v1` yields ELEVEN
# sentences per example, so `order_example` permutes only inside each maximal punctuation-free run:
# runs never cross a sentence or a mark, which keeps every sentence span — and so the whole
# SENT_START array — correct by construction, and leaves the daṇḍas where the editor put them.
# Verified on 80 dev examples: 72 reordered, 48 %% of tokens re-surfaced, arc set preserved on every
# one, no sentence span and no mark moved.
#
# ⚠ SANDHI IS REGENERATED ONLY FOR RUNS THAT MOVED, from NORM rather than ORTH. Re-deriving a clause
# nothing happened to would corrupt ~1 in 12 of them for nothing: the engine is 91.8 %% sentence-
# exact against DCS's editorial text, and the first draft did exactly that (it turned an untouched
# `panthāna ‖` into `panthānaḥ ‖`). Sandhi is never generated ACROSS a mark, for the reason the
# tokeniser treats a daṇḍa as opaque — it is a pause, and pausa forms stand either side of it.
#
# ⚠ `max_epochs = -1` and `shuffle = true` (standing hazard 9): with 0, spaCy lists the corpus once
# and one permutation is sampled per document for the WHOLE run — the augmentation silently never
# varies and the logs look entirely normal.
#
# ⚠ The parser's label set is READ FROM FILE. Under `max_epochs = -1` spaCy initialises from
# `islice(train_corpus, 100)`, so a label the augmenter can produce but those hundred do not contain
# is silently mapped to 0 rather than raising. `init_aug_labels.py` collects it over several passes,
# and on THIS corpus the set includes `punct`.
#
[paths]
train = "corpus_sa_pmerged_norm/sa_vedic-sud-train.pmerged.csl_mwt.spacy"
dev = "corpus_sa_pmerged_norm/sa_vedic-sud-dev.pmerged.csl_mwt.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "sa"
pipeline = ["tok2vec", "tagger", "morphologizer", "lemmatizer", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = -1
max_steps = 20000
eval_frequency = 200
frozen_components = ["tok2vec", "tagger", "morphologizer", "lemmatizer"]
annotating_components = ["tok2vec", "morphologizer"]
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[nlp.tokenizer]
@tokenizers = "sa.SanskritInputTokenizer.v2"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.GoldTokNormCorpus.v1"
path = ${paths.train}
max_length = 0
limit = 0
shuffle = true

[corpora.dev]
@readers = "sud.GoldTokNormCorpus.v1"
path = ${paths.dev}
max_length = 0
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
dep_uas = 0.5
dep_las = 0.5

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
source = "training_sa_mt2_analyser_s1/model-best"

[components.tagger]
source = "training_sa_mt2_analyser_s1/model-best"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 30

[components.morphologizer]
source = "training_sa_mt2_analyser_s1/model-best"

[components.lemmatizer]
source = "training_sa_mt2_analyser_s1/model-best"

[corpora.train.augmenter]
@augmenters = "sud.sa_order_variants.v1"
p_order = 0.5
p_sent = 0.0
p_any = 0.0
seed = 0

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[initialize.components.parser]

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[initialize.components.parser.labels]
@readers = "spacy.read_labels.v1"
path = "labels_sa_pmerged_order/parser.json"
require = true

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.parser.model.tok2vec.embed]
@architectures = "sud.AnalyserFeatsEmbed.v1"
width = 96
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "MORPH"]
rows = [2000, 1000, 1000, 1000, 1024]
include_static_vectors = false
table = null
runtime = true
feats = ["Case", "Number", "Gender", "Person"]
agreement = false
constant = false

[components.parser.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 3
window_size = 1
maxout_pieces = 3