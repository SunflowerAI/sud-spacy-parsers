[paths]
corpus = "corpus_generic_v2"
typology = "assets_typ/typology_v2.json"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "xx"
pipeline = ["tok2vec", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[corpora]

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 4000
max_epochs = 0
max_steps = 20000
eval_frequency = 500
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[pretraining]

[components]

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "sud.GenericCorpus.v1"
path = ${paths.corpus}
split = "train"
seed = 0

[corpora.dev]
@readers = "sud.GenericCorpus.v1"
path = ${paths.corpus}
split = "dev"
seed = 0

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
dep_uas = 0.3
dep_las = 0.6
sents_f = 0.1
dep_las_per_type = null
sents_p = null
sents_r = null

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
factory = "tok2vec"

[components.parser]
factory = "parser"
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false
min_action_freq = 1

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.tok2vec.model.embed]
@architectures = "sud.GenericEmbed.v2"
width = ${components.tok2vec.model.encode.width}
upos_rows = 64
feats = ["AdpType", "AdvType", "Animacy", "Aspect", "Case", "Definite", "Degree", "Deixis", "Evident", "ExtPos", "Gender", "Mood", "NounType", "NumForm", "NumType", "Number", "Number[psor]", "PartType", "Person", "Person[psor]", "Polarity", "Polite", "Poss", "PronType", "PunctType", "Reflex", "Tense", "Variant", "VerbForm", "VerbType", "Voice"]
feat_rows = [32, 64, 16, 64, 256, 32, 32, 32, 8, 64, 32, 128, 64, 16, 64, 32, 16, 128, 32, 16, 16, 8, 8, 128, 64, 8, 32, 16, 64, 32, 64]
typology = null
typology_shuffle = false
typology_constant = false
typology_dim = 8
lang_id = false
langs = []
lang_embed = true
lang_embed_rows = 112
lang_embed_dim = 16

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 128
depth = 4
window_size = 1
maxout_pieces = 3

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

